[package]
name = "eap-peer"
description = "EAP peer methods (TLS, PEAP, TEAP) for the IEEE 802.1X-2020 supplicant"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
pae = { path = "../pae" }
tracing.workspace = true
thiserror.workspace = true
# Used for `Zeroizing<Vec<u8>>` on TLS private-key bytes per ADR-SEC-004
# (#76) — see security-review F-04 (#152).
zeroize.workspace = true

[features]
default = ["eap-tls"]
eap-tls = []
eap-peap = []
eap-teap = []
