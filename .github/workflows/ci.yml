name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-x86_64:
    name: Test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  build-aarch64:
    name: Cross-build (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure cross-linker
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Build (library crates)
        run: |
          cargo build -p pae --target aarch64-unknown-linux-gnu
          cargo build -p eapol-supp --target aarch64-unknown-linux-gnu
          cargo build -p eap-peer --target aarch64-unknown-linux-gnu
          cargo build -p logon --target aarch64-unknown-linux-gnu
      - name: Build (binary crate)
        run: cargo build -p wpa-supplicant --target aarch64-unknown-linux-gnu

  supply-chain:
    # Implements: docs/TODO.md P5.2 / issue #140 (TEST-VV-002).
    # Verifies: REQ-NF-SEC-001/002/003/005 supply-chain posture.
    name: Supply-chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: supply-chain
      # Use prebuilt binaries (taiki-e/install-action) instead of
      # `cargo install` so the gate runs in seconds, not minutes, and
      # is robust against crates.io rate limits.
      - name: Install cargo-audit + cargo-deny (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (advisories + yanked)
        run: cargo audit --deny warnings
      - name: cargo deny check
        run: cargo deny --all-features check
