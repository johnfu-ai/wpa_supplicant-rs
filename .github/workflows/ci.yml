name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test-x86_64:
    name: Test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy
        # `--all-features` so feature-gated production code (raw_socket.rs
        # under `raw-socket`, AES Key Wrap under `macsec`) is also gated.
        # Per #144 / TEST-VV-006 (REQ-NF-SEC-002): each crate root enables
        # `clippy::unwrap_used` + `clippy::expect_used` at `warn`, so
        # `-D warnings` fails CI on any new `.unwrap()` / `.expect()` in
        # production code. Test modules are exempt via
        # `#![cfg_attr(test, allow(...))]`.
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
      - name: Test (EAP method-factory features, #133)
        # Feature-gated EAP-TLS/PEAP/TEAP method factory (#133). Runs the
        # full wpa-supplicant suite under all three EAP features so the
        # rustls TLS engine + PEM factory are exercised in CI, not just
        # compiled by the `--all-features` clippy pass above. The
        # non-EAP integration tests use the explicit-injection
        # constructor (`with_eap_methods`) so they stay green under the
        # feature without depending on PEM files.
        run: cargo test -p wpa-supplicant --features eap-tls-rustls,eap-peap-rustls,eap-teap-rustls

  build-aarch64:
    name: Cross-build (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install cross-linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Configure cross-linker
        run: |
          mkdir -p .cargo
          cat >> .cargo/config.toml <<'EOF'
          [target.aarch64-unknown-linux-gnu]
          linker = "aarch64-linux-gnu-gcc"
          EOF
      - name: Build (library crates)
        run: |
          cargo build -p pae --target aarch64-unknown-linux-gnu
          cargo build -p eapol-supp --target aarch64-unknown-linux-gnu
          cargo build -p eap-peer --target aarch64-unknown-linux-gnu
          cargo build -p logon --target aarch64-unknown-linux-gnu
      - name: Build (binary crate)
        run: cargo build -p wpa-supplicant --target aarch64-unknown-linux-gnu

  no-std:
    # Implements: docs/TODO.md P3.2 / issue #142 (TEST-VV-004).
    # Verifies: REQ-NF-PORT-002 (#61) — the `pae` crate keeps building
    # without `std`. A single accidental `use std::…` in a pae source
    # file would slip through `cargo test --workspace` (default
    # features enable `std`); this gate catches it. Negative-tested
    # locally: injecting `use std::collections::HashMap` into
    # crates/pae/src/mka.rs fails this exact build step.
    name: No-std (pae)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build pae without default features (no_std)
        run: cargo build -p pae --no-default-features
      - name: Build pae no_std + macsec
        run: cargo build -p pae --no-default-features --features macsec

  fuzz:
    # Implements: docs/TODO.md P3.2 / issue #143 (TEST-VV-005).
    # Verifies: REQ-NF-REL-001 (#57) no panics in library crates /
    # REQ-NF-REL-002 (#58) graceful error propagation — the three
    # decoders that parse adversary-controlled bytes (EAPOL frame,
    # EAP packet, MKPDU) must never panic on malformed input.
    # Found + fixed one crash on landing: a Success/Failure packet
    # whose Length field < 4 panicked `EapPacket::decode` (regression
    # test `test_eap_packet_length_field_below_header_rejected`).
    name: Fuzz decoders (1 min/target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/pae/fuzz
            crates/eapol-supp/fuzz
            crates/eap-peer/fuzz
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Fuzz Mkpdu::decode
        run: cargo fuzz run fuzz_mkpdu_decode -- -max_total_time=60
        working-directory: crates/pae
      - name: Fuzz EapolFrame::decode
        run: cargo fuzz run fuzz_eapol_frame_decode -- -max_total_time=60
        working-directory: crates/eapol-supp
      - name: Fuzz EapPacket::decode
        run: cargo fuzz run fuzz_eap_packet_decode -- -max_total_time=60
        working-directory: crates/eap-peer

  supply-chain:
    # Implements: docs/TODO.md P5.2 / issue #140 (TEST-VV-002).
    # Verifies: REQ-NF-SEC-001/002/003/005 supply-chain posture.
    name: Supply-chain (audit + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: supply-chain
      # Use prebuilt binaries (taiki-e/install-action) instead of
      # `cargo install` so the gate runs in seconds, not minutes, and
      # is robust against crates.io rate limits.
      - name: Install cargo-audit + cargo-deny (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - name: cargo audit (advisories + yanked)
        run: cargo audit --deny warnings
      - name: cargo deny check
        run: cargo deny --all-features check

  unsafe-discipline:
    # Implements: issue #141 (TEST-VV-003).
    # Verifies: REQ-NF-SEC-001 (#52) — no `unsafe` without `// SAFETY:`.
    name: Unsafe discipline (geiger + SAFETY gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: unsafe-discipline
      # Hard gate: every `unsafe` block must (a) live in the documented
      # allowlist (systemd.rs, raw_socket.rs) and (b) carry a `// SAFETY:`
      # comment on the same line or within the preceding 10 lines.
      # `cargo geiger` counts unsafe usage but cannot check comment adjacency,
      # so this script is the enforcing gate; geiger below surfaces totals.
      - name: SAFETY-adjacency + allowlist gate
        run: python3 scripts/check_unsafe_safety.py
      # Informational only: surface the workspace unsafe-usage total in the
      # run log. `continue-on-error` so a geiger install/compat hiccup never
      # blocks a merge — the python gate above is the hard contract.
      - name: Install cargo-geiger
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-geiger
        continue-on-error: true
      - name: cargo geiger (totals, informational)
        run: cargo geiger --workspace --output-format Ascii
        continue-on-error: true

  coverage:
    # Implements: issue #139 (TEST-VV-001).
    # Verifies: REQ-NF-MNT-001 (#62) — test coverage >= 80% per crate.
    name: Coverage (llvm-cov >= 80% per crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - name: Install cargo-llvm-cov (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # Collect coverage over the default-feature test suite (the 418
      # non-ignored unit/integration tests). Feature-gated code
      # (`raw_socket.rs`, `macsec`) is covered by feature-specific tests
      # and is out of scope for this default-feature gate.
      - name: cargo llvm-cov (lcov)
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      # Hard gate: fail if any crate falls below its per-crate floor
      # (80% by default; see scripts/check_coverage.py THRESHOLDS).
      - name: Per-crate 80% gate
        run: python3 scripts/check_coverage.py lcov.info
      # HTML report for reviewer diffing (reuses the collected profdata;
      # does not re-run tests).
      - name: cargo llvm-cov report (HTML)
        run: cargo llvm-cov report --html --output-dir coverage
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            lcov.info
          if-no-files-found: error
