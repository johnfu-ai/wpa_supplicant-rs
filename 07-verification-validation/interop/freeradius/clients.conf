# FreeRADIUS client configuration for the interop harness.
#
# hostapd forwards EAP-over-RADIUS to us on the internal subnet.

client hostapd {
    ipaddr          = 0.0.0.0/0
    secret          = testing123
    shortname       = hostapd
    nas_type        = other
    proto           = *
    require_message_auth = no
}