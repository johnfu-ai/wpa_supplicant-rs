# EAP configuration for the interop harness.
#
# Accepts EAP-TLS, EAP-PEAP, and EAP-TEAP using a throwaway CA
# generated by scripts/gen-certs.sh.

eap {
    default_eap_type = tls

    # Timer values (seconds)
    timer_expire     = 60
    ignore_unknown_eap_types = no
    cisco_accounting_username_bug = no

    tls-config tls-common {
        private_key_file     = /etc/raddb/certs/server.key
        certificate_file     = /etc/raddb/certs/server.pem
        # FreeRADIUS 3.2 renamed `CA_file` -> `ca_file` (the old name is
        # deprecated and, with this alpine/OSSL3 build, aborts SSL-context
        # init — root cause of the #138 exit-1).
        ca_file              = /etc/raddb/certs/ca.pem
        dh_file              = /etc/raddb/certs/dh.pem
        random_file          = /dev/urandom
        fragment_size        = 1024
        include_length       = yes
        check_cert_cn        = no
        # OpenSSL 3 cipher string. `-SSLv2` is not a valid selector in
        # modern OpenSSL; `HIGH:MEDIUM` with the default min-protocol
        # (TLS1.2) is plenty for the interop harness.
        cipher_list          = "HIGH:MEDIUM"
    }

    tls {
        tls = tls-common
    }

    peap {
        default_eap_type = mschapv2
        copy_request_to_tunnel = yes
        use_tunneled_reply = yes
        # FreeRADIUS 3.2 requires an inner virtual_server for tunneled
        # EAP types (security hardening); the default image ships
        # `inner-tunnel` enabled.
        virtual_server = "inner-tunnel"
        tls = tls-common
    }

    # EAP-TEAP is intentionally omitted: FreeRADIUS 3.2's TEAP module
    # requires RFC 7170 `authority_identity` + PAC-provisioning config that
    # is out of scope for this interop harness (which defaults to EAP-TLS).
    # Re-add when #133's TEAP factory is exercised end-to-end.

    mschapv2 {
        send_error = no
    }
}