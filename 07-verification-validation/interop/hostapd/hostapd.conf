# hostapd configuration for the interop harness.
#
# Wired-mode 802.1X Authenticator running on a bridge interface.
# The supplicant binary connects to this bridge via a second veth pair
# and receives EAPOL frames; hostapd proxies EAP to FreeRADIUS.

interface=br0
bridge=br0
driver=wired

# IEEE 802.1X options
ieee8021x=1
eapol_version=3
eap_server=0                     # Use external RADIUS server
eapol_key_index_workaround=0
eap_message=1

# RADIUS authentication server
auth_server_addr=freeradius
auth_server_port=1812
auth_server_shared_secret=testing123

# RADIUS accounting server
acct_server_addr=freeradius
acct_server_port=1813
acct_server_shared_secret=testing123

# Periodic reauthentication
eap_reauth_period=3600

# MACsec / MKA (disabled for wired interop — hostapd does not support
# MKA over wired interfaces in the `wired` driver mode).
# macsec=0