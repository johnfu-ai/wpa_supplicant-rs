# Phase 07 V&V — FreeRADIUS interop harness
#
# Per `docs/TODO.md` P3.1. Starts the RADIUS authentication server
# and the hostapd wired-mode authenticator the supplicant binary
# exchanges EAPOL frames with.
#
# Usage:
#   cd 07-verification-validation/interop
#   ./scripts/gen-certs.sh
#   docker compose up -d

services:

  freeradius:
    image: freeradius/freeradius-server:latest-3.2-alpine
    container_name: wpa-sup-freeradius
    ports:
      - "1812:1812/udp"   # RADIUS auth
      - "1813:1813/udp"   # RADIUS accounting
    volumes:
      - ./freeradius/clients.conf:/etc/raddb/clients.conf:ro
      - ./freeradius/eap.conf:/etc/raddb/mods-enabled/eap:ro
      - ./freeradius/users:/etc/raddb/users:ro
      - ./freeradius/certs:/etc/raddb/certs:ro
    environment:
      - RADIUS_SRC_PORT=0
    networks:
      - radius-net
    healthcheck:
      test: freeradius -C
      interval: 5s
      retries: 5

  hostapd:
    image: alpine:3.20
    container_name: wpa-sup-hostapd
    command: >
      sh -c "
      apk add --no-cache hostapd iptables iproute2 &&
      ip link set eth0 up &&
      # hostapd needs a bridge interface for wired mode
      ip link add br0 type bridge &&
      ip link set eth0 master br0 &&
      ip link set br0 up &&
      hostapd /etc/hostapd/hostapd.conf -dd
      "
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      radius-net:
      eapol-net:
    volumes:
      - ./hostapd/hostapd.conf:/etc/hostapd/hostapd.conf:ro
    depends_on:
      freeradius:
        condition: service_healthy

networks:
  radius-net:
    internal: true
  eapol-net:
    # The test runner attaches the supplicant container to this
    # bridge L2 network so EAPOL frames flow between the binary
    # and hostapd's wired-mode interface.
    name: wpa-sup-eapol-net
    driver: bridge